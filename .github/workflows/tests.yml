name: Tests

on:
  pull_request:
    branches: [main]
    # No path filter: this workflow gates merges as a required status check, and a
    # required check that never reports (a docs-only pull request) blocks it for good.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Calls the one shared definition in laranail/.github. Everything this file used
# to spell out -- the PHP matrix, the composer cache and its laranail eviction,
# prefer-lowest, fail-fast, timeouts -- lives there now, so a change to how this
# family tests is one edit instead of fifty.
jobs:
  pest:
    uses: laranail/.github/.github/workflows/tests.yml@main
    with:
      # Pin nothing: resolve whatever composer.json allows. The shared workflow
      # still defaults laravel-versions to ["13.*"], which runs
      # `composer require illuminate/contracts` and REWRITES composer.json, so
      # the suite would test a manifest this package does not ship. Remove this
      # line only once that default is ["*"].
      laravel-versions: '["*"]'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql'

  # The matrix above runs on SQLite, and the engine tests compare SQL strings,
  # so nothing there can say whether Postgres accepts the SQL. This job
  # provisions against real servers as an admin holding only CREATEDB and
  # CREATEROLE -- the shape of a managed service's admin user, which is what
  # the grant and drop paths have to work under. A superuser builds the
  # fixtures the admin cannot. --fail-on-skipped turns a missing variable into
  # a failure rather than an empty pass.
  #
  # Versions: the latest release, the three before it, and the oldest major
  # the PostgreSQL project still supports (Postgres has no LTS line; 14 is
  # supported until 2026-11-12). The behaviour this covers changes across
  # exactly these: PG15 took CREATE on schema public from PUBLIC, PG16 stopped
  # CREATEROLE admins inheriting the roles they create. The next major runs as
  # well, but its failures do not fail the run. When a major is released or
  # reaches end of life, move the list: https://www.postgresql.org/support/versioning/
  live-pgsql:
    name: live provisioning · pgsql ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.next }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: '18', label: '18 (latest)', next: false }
          - { postgres: '17', label: '17', next: false }
          - { postgres: '16', label: '16', next: false }
          - { postgres: '15', label: '15', next: false }
          - { postgres: '14', label: '14 (oldest supported)', next: false }
          - { postgres: '19rc1', label: '19 (next, release candidate)', next: true }
    # Reads the repository and nothing else; the token is used only to fetch
    # dependencies from public repositories.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Create a restricted admin (CREATEDB CREATEROLE, not a superuser)
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1 -U postgres
          -c "SELECT version()"
          -c "CREATE ROLE db_console_admin WITH LOGIN PASSWORD 'secret' CREATEDB CREATEROLE NOSUPERUSER"
      - name: Live provisioning
        env:
          DB_CONSOLE_LIVE_PGSQL_PORT: '5432'
          DB_CONSOLE_LIVE_PGSQL_ADMIN_USER: db_console_admin
          DB_CONSOLE_LIVE_PGSQL_ADMIN_PASSWORD: secret
          DB_CONSOLE_LIVE_PGSQL_SUPERUSER: postgres
          DB_CONSOLE_LIVE_PGSQL_SUPERUSER_PASSWORD: secret
        run: vendor/bin/pest --no-coverage --colors=never --group=live-pgsql --fail-on-skipped

  # The matrix above runs on SQLite, which has no transport to encrypt. This
  # job proves the TLS probe against servers that answer for real: the image
  # defaults give a plaintext PostgreSQL and a MySQL whose TLS starts only
  # when a CA is applied. --fail-on-skipped turns a missing variable into a
  # failure rather than an empty pass.
  live-tls:
    name: live TLS · mysql 8.4 · pgsql 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the repository and nothing else; the token is used only to fetch
    # dependencies from public repositories.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: db_console
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: db_console_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U db_console" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: db_console_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Copy the MySQL CA out of the service container
        run: docker cp "${{ job.services.mysql.id }}:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-ca.pem"
      - name: Live TLS
        env:
          DB_CONSOLE_LIVE_MYSQL_PORT: '3306'
          DB_CONSOLE_LIVE_MYSQL_CA: ${{ runner.temp }}/mysql-ca.pem
          DB_CONSOLE_LIVE_PGSQL_PORT: '5432'
        run: vendor/bin/pest --no-coverage --colors=never --group=live-tls --fail-on-skipped

  # The same blind spot for the MySQL family: MySqlEngine's tests compare SQL
  # strings and nothing had ever provisioned against a real server. The admin
  # is created with exactly the grants DoctorService recommends (the test
  # suite pins this file to that recommendation), never root, and MySQL runs
  # with sql_require_primary_key=ON the way DigitalOcean's managed MySQL does.
  # 8.4 is the only MySQL DigitalOcean offers; 9 and MariaDB latest catch what
  # the next release changes.
  live-mysql:
    name: live provisioning · ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: mysql, version: '8.4', image: 'mysql:8.4', client: mysql, health: 'mysqladmin ping -h 127.0.0.1 -uroot -psecret' }
          - { engine: mysql, version: '9', image: 'mysql:9', client: mysql, health: 'mysqladmin ping -h 127.0.0.1 -uroot -psecret' }
          - { engine: mariadb, version: '11.4', image: 'mariadb:11.4', client: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { engine: mariadb, version: 'latest', image: 'mariadb:latest', client: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_mysql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Create the recommended minimal admin (not root)
        run: |
          {
            # The recommended grant, verbatim between the markers. MinimalAdminGrantTest
            # fails if it drifts from DoctorService's recommendation.
            # >>> minimal-admin
            echo "CREATE USER 'db_console_admin'@'%' IDENTIFIED BY 'secret';"
            echo "GRANT CREATE USER ON *.* TO 'db_console_admin'@'%';"
            echo "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, EVENT, TRIGGER ON *.* TO 'db_console_admin'@'%' WITH GRANT OPTION;"
            # <<< minimal-admin
            if [ "${{ matrix.engine }}" = mysql ]; then echo "SET PERSIST sql_require_primary_key = ON;"; fi
          } | docker exec -i "${{ job.services.database.id }}" ${{ matrix.client }} -uroot -psecret
      - name: Live provisioning
        env:
          DB_CONSOLE_LIVE_MYSQL_ENGINE: ${{ matrix.engine }}
          DB_CONSOLE_LIVE_MYSQL_PORT: '3306'
          DB_CONSOLE_LIVE_MYSQL_ADMIN_USER: db_console_admin
          DB_CONSOLE_LIVE_MYSQL_ADMIN_PASSWORD: secret
        run: vendor/bin/pest --no-coverage --colors=never --group=live-mysql --fail-on-skipped

  # SSH tunnels against a real OpenSSH server, with both drivers. The server
  # runs in a container on the service network, so from it the databases are
  # `postgres` and `mysql`, and it mounts both servers' socket directories so
  # forwards to a remote Unix socket are exercised too. A second, unrelated
  # host key proves the pin refuses. --fail-on-skipped turns a missing
  # variable into a failure rather than an empty pass.
  live-ssh:
    name: live SSH tunnels · openssh + phpseclib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: db_console
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: db_console_test
        volumes:
          - pgsocket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U db_console" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: db_console_test
        volumes:
          - mysqlsocket:/var/run/mysqld
        options: >-
          --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Generate the client key and an unrelated host key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C db-console-ci -f "$RUNNER_TEMP/id_tunnel"
          ssh-keygen -q -t ed25519 -N '' -C impostor -f "$RUNNER_TEMP/impostor_host_key"
      - name: Start an OpenSSH server on the service network
        run: |
          docker run -d --name sshd \
            --network "${{ job.services.postgres.network }}" \
            -p 2222:22 \
            -v pgsocket:/var/run/postgresql \
            -v mysqlsocket:/var/run/mysqld \
            -v "$RUNNER_TEMP/id_tunnel.pub:/authorized_keys:ro" \
            alpine:3.22 sh -euc '
              apk add --no-cache openssh-server >/dev/null
              ssh-keygen -A
              adduser -D tunnel
              # Alpine creates the account locked ("!"), which sshd refuses
              # even for a key; "*" has no password and is not locked.
              sed -i "s/^tunnel:!/tunnel:*/" /etc/shadow
              install -d -m 700 -o tunnel -g tunnel /home/tunnel/.ssh
              install -m 600 -o tunnel -g tunnel /authorized_keys /home/tunnel/.ssh/authorized_keys
              exec /usr/sbin/sshd -D -e \
                -o AllowTcpForwarding=yes -o AllowStreamLocalForwarding=yes \
                -o PasswordAuthentication=no -o PermitRootLogin=no
            '
          for attempt in $(seq 1 60); do
            if ssh-keyscan -p 2222 -t ed25519 127.0.0.1 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker logs sshd
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1
      - name: Read the pinned host key from the server itself
        run: |
          {
            echo "DB_CONSOLE_LIVE_SSH_HOST_KEY=$(docker exec sshd cat /etc/ssh/ssh_host_ed25519_key.pub)"
            echo "DB_CONSOLE_LIVE_SSH_WRONG_HOST_KEY=$(cat "$RUNNER_TEMP/impostor_host_key.pub")"
          } >> "$GITHUB_ENV"
      - name: Copy the MySQL CA out of the service container
        run: docker cp "${{ job.services.mysql.id }}:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-ca.pem"
      - name: Live SSH tunnels
        env:
          DB_CONSOLE_LIVE_SSH_PORT: '2222'
          DB_CONSOLE_LIVE_SSH_USER: tunnel
          DB_CONSOLE_LIVE_SSH_KEY: ${{ runner.temp }}/id_tunnel
          DB_CONSOLE_LIVE_MYSQL_CA: ${{ runner.temp }}/mysql-ca.pem
        run: vendor/bin/pest --no-coverage --colors=never --group=live-ssh --fail-on-skipped
      - name: SSH server log
        if: failure()
        run: docker logs sshd
