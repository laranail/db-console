name: Tests

on:
  pull_request:
    branches: [main]
    # No path filter: this workflow gates merges as a required status check, and a
    # required check that never reports (a docs-only pull request) blocks it for good.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Calls the one shared definition in laranail/.github. Everything this file used
# to spell out -- the PHP matrix, the composer cache and its laranail eviction,
# prefer-lowest, fail-fast, timeouts -- lives there now, so a change to how this
# family tests is one edit instead of fifty.
jobs:
  pest:
    uses: laranail/.github/.github/workflows/tests.yml@main
    with:
      # Pin nothing: resolve whatever composer.json allows. The shared workflow
      # still defaults laravel-versions to ["13.*"], which runs
      # `composer require illuminate/contracts` and REWRITES composer.json, so
      # the suite would test a manifest this package does not ship. Remove this
      # line only once that default is ["*"].
      laravel-versions: '["*"]'
      php-extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql'

  # The matrix above runs on SQLite, and the engine tests compare SQL strings,
  # so nothing there can say whether Postgres accepts the SQL. This job
  # provisions against real servers as an admin holding only CREATEDB and
  # CREATEROLE -- the shape of a managed service's admin user, which is what
  # the grant and drop paths have to work under. A superuser builds the
  # fixtures the admin cannot. --fail-on-skipped turns a missing variable into
  # a failure rather than an empty pass.
  #
  # Versions: the latest release, the three before it, and the oldest major
  # the PostgreSQL project still supports (Postgres has no LTS line; 14 is
  # supported until 2026-11-12). The behaviour this covers changes across
  # exactly these: PG15 took CREATE on schema public from PUBLIC, PG16 stopped
  # CREATEROLE admins inheriting the roles they create. The next major runs as
  # well, but its failures do not fail the run. When a major is released or
  # reaches end of life, move the list: https://www.postgresql.org/support/versioning/
  live-pgsql:
    name: live provisioning · pgsql ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.next }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: '18', label: '18 (latest)', next: false }
          - { postgres: '17', label: '17', next: false }
          - { postgres: '16', label: '16', next: false }
          - { postgres: '15', label: '15', next: false }
          - { postgres: '14', label: '14 (oldest supported)', next: false }
          - { postgres: '19rc1', label: '19 (next, release candidate)', next: true }
          # A cluster whose default locale provider is ICU (initdb
          # --locale-provider=icu, PG15+), as some managed services ship. Its
          # template0 is ICU, which has no SQL_ASCII, so creating one in the C
          # locale works only when the statement asks for libc.
          - { postgres: '17', label: '17 · ICU cluster', next: false, initdb: '--locale-provider=icu --icu-locale=en-US' }
    # Reads the repository and nothing else; the token is used only to fetch
    # dependencies from public repositories.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_INITDB_ARGS: ${{ matrix.initdb || '' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        uses: ./.github/actions/composer-update
        with:
          args: --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Create a restricted admin (CREATEDB CREATEROLE, not a superuser)
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1 -U postgres
          -c "SELECT version()"
          -c "CREATE ROLE db_console_admin WITH LOGIN PASSWORD 'secret' CREATEDB CREATEROLE NOSUPERUSER"
      - name: Live provisioning
        env:
          DB_CONSOLE_LIVE_PGSQL_PORT: '5432'
          DB_CONSOLE_LIVE_PGSQL_ADMIN_USER: db_console_admin
          DB_CONSOLE_LIVE_PGSQL_ADMIN_PASSWORD: secret
          DB_CONSOLE_LIVE_PGSQL_SUPERUSER: postgres
          DB_CONSOLE_LIVE_PGSQL_SUPERUSER_PASSWORD: secret
        run: vendor/bin/pest --no-coverage --colors=never --group=live-pgsql --fail-on-skipped

  # The matrix above runs on SQLite, which has no transport to encrypt. This
  # job proves doctor's TLS verdicts against servers that answer for real, in
  # the shape of a managed service: MySQL with require_secure_transport=ON and
  # PostgreSQL with ssl=on and a pg_hba that rejects every non-TLS host line,
  # both serving a certificate from a CA generated here, both reached through
  # restricted admins (never root or a superuser). A plaintext MySQL and a
  # plaintext PostgreSQL run beside them, so the guard can be pointed at a
  # server that cannot encrypt and be seen to fail.
  #
  # The servers start from steps rather than services: a service container
  # starts before any step, so it cannot mount a certificate the job has not
  # generated yet. Every server is reached as db.live-tls.test, because doctor
  # exempts localhost and 127.0.0.1 from the TLS check, and the certificate
  # names only that host, so verification is checked against the name.
  # --fail-on-skipped turns a missing variable into a failure rather than an
  # empty pass.
  live-tls:
    name: live TLS · mysql 8.4 · pgsql 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the repository and nothing else; the token is used only to fetch
    # dependencies from public repositories.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        uses: ./.github/actions/composer-update
        with:
          args: --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Name the runner db.live-tls.test (a host doctor does not exempt as local)
        run: echo '127.0.0.1 db.live-tls.test' | sudo tee -a /etc/hosts
      - name: Generate a CA and a server certificate for db.live-tls.test
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls/mysql" "$tls/pgsql"
          cd "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=db-console live-tls CA' -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj '/CN=db.live-tls.test' -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:db.live-tls.test\n' > san.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -extfile san.ext -out server.pem
          cp ca.pem server.pem server.key mysql/
          cp ca.pem server.pem server.key pgsql/
          # The only way in over TCP is hostssl; local (the socket, used below
          # to create the admin) stays open, as on any self-managed server.
          printf '%s\n' 'local all all trust' 'hostnossl all all all reject' 'hostssl all all all scram-sha-256' > pgsql/pg_hba.conf
          # Both images run their server as uid 999. PostgreSQL refuses a key
          # that is not private to that user.
          chmod 0644 mysql/* pgsql/*
          chmod 0600 pgsql/server.key
          sudo chown -R 999:999 mysql pgsql
      - name: Start the servers
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/tls"
          docker run -d --name mysql-tls -p 3306:3306 -v "$tls/mysql:/etc/db-tls:ro" \
            -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=db_console_test mysql:8.4 \
            --require-secure-transport=ON \
            --ssl-ca=/etc/db-tls/ca.pem --ssl-cert=/etc/db-tls/server.pem --ssl-key=/etc/db-tls/server.key
          docker run -d --name pgsql-tls -p 5432:5432 -v "$tls/pgsql:/etc/db-tls:ro" \
            -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=db_console_test postgres:18 \
            -c ssl=on -c ssl_ca_file=/etc/db-tls/ca.pem \
            -c ssl_cert_file=/etc/db-tls/server.pem -c ssl_key_file=/etc/db-tls/server.key \
            -c hba_file=/etc/db-tls/pg_hba.conf
          # Plaintext only: TLS switched off, so nothing can be negotiated.
          docker run -d --name mysql-plain -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=db_console_test mysql:8.4 --tls-version=''
          docker run -d --name pgsql-plain -p 5433:5432 \
            -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=db_console_test postgres:18
          # Over TCP inside each container: the images' first-run servers listen
          # on the socket only, so a TCP answer means the real server is up.
          wait_for() {
            for _ in $(seq 1 60); do
              if docker exec "$1" sh -c "$2" > /dev/null 2>&1; then return 0; fi
              sleep 2
            done
            echo "$1 never answered: $2"
            docker exec "$1" sh -c "$2" || true
            docker logs "$1" 2>&1 | tail -n 30
            return 1
          }
          wait_for mysql-tls 'mysqladmin ping -h 127.0.0.1 -uroot -psecret --get-server-public-key --silent'
          wait_for mysql-plain 'mysqladmin ping -h 127.0.0.1 -uroot -psecret --get-server-public-key --silent'
          wait_for pgsql-tls 'pg_isready -h 127.0.0.1 -U postgres'
          wait_for pgsql-plain 'pg_isready -h 127.0.0.1 -U postgres'
      - name: Create restricted admins (the minimal MySQL grant; CREATEDB CREATEROLE NOSUPERUSER)
        run: |
          set -euo pipefail
          {
            # The recommended grant, verbatim between the markers. MinimalAdminGrantTest
            # fails if it drifts from DoctorService's recommendation, and
            # LiveTlsTest fails if this copy drifts from live-mysql's.
            # >>> minimal-admin
            echo "CREATE USER 'db_console_admin'@'%' IDENTIFIED BY 'secret';"
            echo "GRANT CREATE USER ON *.* TO 'db_console_admin'@'%';"
            echo "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, EVENT, TRIGGER ON *.* TO 'db_console_admin'@'%' WITH GRANT OPTION;"
            # <<< minimal-admin
          } > "$RUNNER_TEMP/minimal-admin.sql"
          # Over the socket, which require_secure_transport counts as secure.
          for server in mysql-tls mysql-plain; do
            docker exec -i "$server" mysql -uroot -psecret < "$RUNNER_TEMP/minimal-admin.sql"
          done
          for server in pgsql-tls pgsql-plain; do
            docker exec "$server" psql -v ON_ERROR_STOP=1 -U postgres \
              -c "CREATE ROLE db_console_admin WITH LOGIN PASSWORD 'secret' CREATEDB CREATEROLE NOSUPERUSER"
          done
      - name: Live TLS
        env:
          DB_CONSOLE_LIVE_TLS_HOST: db.live-tls.test
          DB_CONSOLE_LIVE_TLS_CA: ${{ runner.temp }}/tls/ca.pem
          DB_CONSOLE_LIVE_TLS_ADMIN_USER: db_console_admin
          DB_CONSOLE_LIVE_TLS_ADMIN_PASSWORD: secret
          DB_CONSOLE_LIVE_MYSQL_PORT: '3306'
          DB_CONSOLE_LIVE_MYSQL_PLAIN_PORT: '3307'
          DB_CONSOLE_LIVE_PGSQL_PORT: '5432'
          DB_CONSOLE_LIVE_PGSQL_PLAIN_PORT: '5433'
        run: vendor/bin/pest --no-coverage --colors=never --group=live-tls --fail-on-skipped
      - name: Server logs
        if: failure()
        run: for server in mysql-tls mysql-plain pgsql-tls pgsql-plain; do echo "::group::$server"; docker logs "$server" 2>&1 | tail -n 50; echo '::endgroup::'; done

  # The same blind spot for the MySQL family: MySqlEngine's tests compare SQL
  # strings and nothing had ever provisioned against a real server. The admin
  # is created with exactly the grants DoctorService recommends (the test
  # suite pins this file to that recommendation), never root, and MySQL runs
  # with sql_require_primary_key=ON the way DigitalOcean's managed MySQL does.
  # 8.4 is the only MySQL DigitalOcean offers; 9 and MariaDB latest catch what
  # the next release changes.
  live-mysql:
    name: live provisioning · ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: mysql, version: '8.4', image: 'mysql:8.4', client: mysql, health: 'mysqladmin ping -h 127.0.0.1 -uroot -psecret' }
          - { engine: mysql, version: '9', image: 'mysql:9', client: mysql, health: 'mysqladmin ping -h 127.0.0.1 -uroot -psecret' }
          - { engine: mariadb, version: '11.4', image: 'mariadb:11.4', client: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { engine: mariadb, version: 'latest', image: 'mariadb:latest', client: mariadb, health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_mysql'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        uses: ./.github/actions/composer-update
        with:
          args: --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Create the recommended minimal admin (not root)
        run: |
          {
            # The recommended grant, verbatim between the markers. MinimalAdminGrantTest
            # fails if it drifts from DoctorService's recommendation.
            # >>> minimal-admin
            echo "CREATE USER 'db_console_admin'@'%' IDENTIFIED BY 'secret';"
            echo "GRANT CREATE USER ON *.* TO 'db_console_admin'@'%';"
            echo "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, EVENT, TRIGGER ON *.* TO 'db_console_admin'@'%' WITH GRANT OPTION;"
            # <<< minimal-admin
            if [ "${{ matrix.engine }}" = mysql ]; then
              echo "SET PERSIST sql_require_primary_key = ON;"
            fi
          } | docker exec -i "${{ job.services.database.id }}" ${{ matrix.client }} -uroot -psecret
      # GTID on, as on DigitalOcean: mysqldump then needs --set-gtid-purged=OFF
      # or RELOAD/FLUSH_TABLES, which the minimal admin does not hold. MySQL
      # changes gtid_mode one step at a time, from wherever the image starts.
      - name: Turn GTID on (MySQL)
        if: matrix.engine == 'mysql'
        run: |
          sql() { docker exec -i "${{ job.services.database.id }}" mysql -N -uroot -psecret -e "$1"; }
          sql "SET PERSIST enforce_gtid_consistency = ON"
          steps="OFF OFF_PERMISSIVE ON_PERMISSIVE ON"
          current=$(sql "SELECT @@GLOBAL.gtid_mode")
          past=no
          for mode in $steps; do
            if [ "$past" = yes ]; then sql "SET PERSIST gtid_mode = $mode"; fi
            if [ "$mode" = "$current" ]; then past=yes; fi
          done
          sql "SELECT @@GLOBAL.gtid_mode, @@GLOBAL.enforce_gtid_consistency"
      # Backup-before-drop shells out to the dump client, so each leg needs the
      # client of its own family: the runner's MySQL client, or MariaDB's.
      - name: Install the dump client
        run: |
          if [ "${{ matrix.engine }}" = mariadb ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
            mariadb-dump --version
          else
            mysqldump --version
          fi
      - name: Live provisioning
        env:
          DB_CONSOLE_LIVE_MYSQL_ENGINE: ${{ matrix.engine }}
          DB_CONSOLE_LIVE_MYSQL_PORT: '3306'
          DB_CONSOLE_LIVE_MYSQL_ADMIN_USER: db_console_admin
          DB_CONSOLE_LIVE_MYSQL_ADMIN_PASSWORD: secret
        run: vendor/bin/pest --no-coverage --colors=never --group=live-mysql --fail-on-skipped

  # SSH tunnels against a real OpenSSH server, with both drivers. The server
  # runs in a container on the service network, so from it the databases are
  # `postgres` and `mysql`, and it mounts both servers' socket directories so
  # forwards to a remote Unix socket are exercised too. A second, unrelated
  # host key proves the pin refuses. --fail-on-skipped turns a missing
  # variable into a failure rather than an empty pass.
  live-ssh:
    name: live SSH tunnels · openssh + phpseclib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: db_console
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: db_console_test
        volumes:
          - pgsocket:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U db_console" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: db_console_test
        volumes:
          - mysqlsocket:/var/run/mysqld
        options: >-
          --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: 'dom, curl, libxml, mbstring, zip, fileinfo, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, sodium'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        uses: ./.github/actions/composer-update
        with:
          args: --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Generate the client key and an unrelated host key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C db-console-ci -f "$RUNNER_TEMP/id_tunnel"
          ssh-keygen -q -t ed25519 -N '' -C impostor -f "$RUNNER_TEMP/impostor_host_key"
      - name: Start an OpenSSH server on the service network
        run: |
          docker run -d --name sshd \
            --network "${{ job.services.postgres.network }}" \
            -p 2222:22 \
            -v pgsocket:/var/run/postgresql \
            -v mysqlsocket:/var/run/mysqld \
            -v "$RUNNER_TEMP/id_tunnel.pub:/authorized_keys:ro" \
            alpine:3.22 sh -euc '
              apk add --no-cache openssh-server >/dev/null
              ssh-keygen -A
              adduser -D tunnel
              # Alpine creates the account locked ("!"), which sshd refuses
              # even for a key; "*" has no password and is not locked.
              sed -i "s/^tunnel:!/tunnel:*/" /etc/shadow
              install -d -m 700 -o tunnel -g tunnel /home/tunnel/.ssh
              install -m 600 -o tunnel -g tunnel /authorized_keys /home/tunnel/.ssh/authorized_keys
              exec /usr/sbin/sshd -D -e \
                -o AllowTcpForwarding=yes -o AllowStreamLocalForwarding=yes \
                -o PasswordAuthentication=no -o PermitRootLogin=no
            '
          for attempt in $(seq 1 60); do
            if ssh-keyscan -p 2222 -t ed25519 127.0.0.1 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker logs sshd
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1
      - name: Read the pinned host key from the server itself
        run: |
          {
            echo "DB_CONSOLE_LIVE_SSH_HOST_KEY=$(docker exec sshd cat /etc/ssh/ssh_host_ed25519_key.pub)"
            echo "DB_CONSOLE_LIVE_SSH_WRONG_HOST_KEY=$(cat "$RUNNER_TEMP/impostor_host_key.pub")"
          } >> "$GITHUB_ENV"
      - name: Copy the MySQL CA out of the service container
        run: docker cp "${{ job.services.mysql.id }}:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-ca.pem"
      # A PostgreSQL with TLS on, so verification inside the tunnel is proven
      # rather than assumed. Its certificate names `pgtls` only; the same
      # container also answers to `pgtls-alias`, which a verifying client must
      # refuse. Started with docker run because a service container cannot
      # take server arguments, and the key is copied in so postgres owns it.
      - name: Issue a CA and a certificate for pgtls
        run: |
          mkdir -p "$RUNNER_TEMP/pgtls" && cd "$RUNNER_TEMP/pgtls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 2 -subj "/CN=db-console CI CA" -keyout ca.key -out ca.crt
          openssl req -nodes -newkey rsa:2048 -subj "/CN=pgtls" -keyout server.key -out server.csr
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -out server.crt \
            -extfile <(printf 'subjectAltName=DNS:pgtls\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n')
          openssl x509 -in server.crt -noout -ext subjectAltName
      - name: Start PostgreSQL with TLS on the service network
        run: |
          docker run -d --name pgtls \
            --network "${{ job.services.postgres.network }}" \
            --network-alias pgtls --network-alias pgtls-alias \
            -e POSTGRES_USER=db_console -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=db_console_test \
            -v "$RUNNER_TEMP/pgtls:/certs:ro" \
            --entrypoint bash postgres:18 -euc '
              install -d -o postgres -g postgres -m 700 /etc/pgtls
              install -o postgres -g postgres -m 600 /certs/server.crt /certs/server.key /etc/pgtls/
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/etc/pgtls/server.crt -c ssl_key_file=/etc/pgtls/server.key
            '
          # TCP only answers once initdb's temporary socket-only server is gone.
          for attempt in $(seq 1 60); do
            if docker exec pgtls pg_isready -h 127.0.0.1 -U db_console >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec pgtls pg_isready -h 127.0.0.1 -U db_console
      - name: Install the PostgreSQL 18 client tools for pg_dump
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Live SSH tunnels
        env:
          DB_CONSOLE_LIVE_SSH_PORT: '2222'
          DB_CONSOLE_LIVE_SSH_USER: tunnel
          DB_CONSOLE_LIVE_SSH_KEY: ${{ runner.temp }}/id_tunnel
          DB_CONSOLE_LIVE_MYSQL_CA: ${{ runner.temp }}/mysql-ca.pem
          DB_CONSOLE_LIVE_PGTLS_CA: ${{ runner.temp }}/pgtls/ca.crt
          DB_CONSOLE_LIVE_PG_BIN: /usr/lib/postgresql/18/bin
        # Bounded so a hung tunnel fails the step (and the logs below still
        # run) instead of the job being cancelled at its own timeout. Events
        # stream as they happen, so a hang names the test it happened in;
        # pest's own output is buffered when stdout is not a terminal.
        timeout-minutes: 8
        run: >-
          vendor/bin/pest --no-coverage --colors=never --group=live-ssh --fail-on-skipped
          --log-events-text "$RUNNER_TEMP/live-ssh-events.txt"
      - name: Test events, processes, SSH server and TLS PostgreSQL logs
        if: failure()
        run: |
          grep -E 'Test (Prepared|Passed|Failed|Errored|Finished)' "$RUNNER_TEMP/live-ssh-events.txt" | tail -40 || true
          ps -eo pid,etime,args | grep -E 'ssh|php|pg_dump|psql' | grep -v grep || true
          docker logs sshd
          docker logs pgtls
